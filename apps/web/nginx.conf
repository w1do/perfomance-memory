# web: статика + прокси /api → api, /mcp → mcp. Наружу публикуется только этот контейнер.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # встроенный DNS docker: имена сервисов резолвятся заново после перезапуска контейнеров
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;
  set $mcp_upstream http://mcp:8081;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    # фактический лимит аудио (MAX_AUDIO_MB) проверяет api
    client_max_body_size 210m;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # MCP Streamable HTTP: без буферизации, длинные ответы
  location = /mcp {
    proxy_pass $mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
