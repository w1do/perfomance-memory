# CI/CD: lint → test → build (образы в GitHub Container Registry) → deploy (Dokploy по webhook).
# Секрет репозитория: DOKPLOY_WEBHOOK_URL (Settings → Secrets and variables → Actions). Без него деплой пропускается.
# Образы: ghcr.io/<владелец>/<репозиторий>/<сервис>:<short-sha> и :latest (ветка main), :<тег> для тегов v*.
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm } # vitest 5 требует Node ≥ 22; образы сервисов — Node 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ['6333:6333']
    env:
      QDRANT_TEST_URL: http://localhost:6333 # globalSetup тестов не поднимает свой контейнер
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -fs http://localhost:6333/readyz && exit 0; sleep 2; done; exit 1
      - run: npm test

  build:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, mcp, backup, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app == 'web' && 'apps/web/Dockerfile' || 'Dockerfile.node' }}
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then echo "DOKPLOY_WEBHOOK_URL не задан — деплой пропущен"; exit 0; fi
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
