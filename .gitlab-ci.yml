# CI/CD: lint → test → build (образы в GitLab Container Registry) → deploy (Dokploy по webhook).
# Переменные проекта в GitLab (Settings → CI/CD → Variables): DOKPLOY_WEBHOOK_URL (masked) — адрес
# «Deploy webhook» compose-приложения в Dokploy. CI_REGISTRY_* GitLab задаёт сам.
stages: [lint, test, build, deploy]

default:
  interruptible: true

# Тесты и линт — на Node 24 (vitest 5 требует Node ≥ 22); сами образы сервисов остаются на Node 20.
.node:
  image: node:24-alpine
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

lint:
  stage: lint
  extends: .node
  script:
    - npm run lint
    - npm run typecheck

test:
  stage: test
  extends: .node
  services:
    - name: qdrant/qdrant:v1.19.1
      alias: qdrant
  variables:
    QDRANT_TEST_URL: http://qdrant:6333 # globalSetup тестов не поднимает свой контейнер
  script:
    - npm test

build:
  stage: build
  image: docker:28
  services: [docker:28-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  parallel:
    matrix:
      - APP: [api, mcp, backup, web]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$APP"
    - if [ "$APP" = web ]; then DOCKERFILE=apps/web/Dockerfile; else DOCKERFILE=Dockerfile.node; fi
    - docker pull "$IMAGE:latest" || true
    - >
      docker build --pull -f "$DOCKERFILE" --build-arg APP="$APP" --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG" && docker push "$IMAGE:$CI_COMMIT_TAG"
      else
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest" && docker push "$IMAGE:latest"
      fi

deploy:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: [build]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOKPLOY_WEBHOOK_URL
  script:
    # Dokploy заново тянет образы :latest из registry и перезапускает стек (docker-compose.prod.yml)
    - curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
